[project]
name = "whisper-a-note"
version = "0.0.1"
description = "Record meetings, write timestamped notes, transcribe locally with speaker diarization."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.1",
    "pyannote-audio>=4.0",
    "torch>=2.8",
    "torchaudio>=2.8",
    "soundfile>=0.12",
    "numpy>=1.26",
    "platformdirs>=4.0",
    "av<16",  # faster-whisper 1.2 passes metadata_errors, removed in PyAV 16+
    "soundcard>=0.4.6",
    "soxr>=1.1.0",
]

[project.scripts]
whisper-a-note = "whisper_a_note.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whisper_a_note"]

# PyTorch CPU build by default (SPEC DIST-02, DEV-2).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "psutil>=7.2.2",
]
